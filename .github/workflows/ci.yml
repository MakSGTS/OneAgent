name: CI

on:
  push:
  pull_request:

jobs:
  codex-prompts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate Prompt Contract v2
        run: scripts/validate-codex-prompts.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Build public Runtime processes
        run: cargo build -p oneagent-runtime --bin oneagent-mcp --bin oneagent-lsp

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Test Context and MCP compatibility
        run: |
          cargo test -p oneagent-analysis --test context_engine
          cargo test -p oneagent-runtime --test mcp_semantic_tools
          cargo test -p oneagent-runtime --test mcp_process

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Build public Runtime
        run: cargo build -p oneagent-runtime --bin oneagent-mcp

      - name: Install extension dependencies
        run: pnpm --dir extensions/vscode install --frozen-lockfile

      - name: Typecheck extension
        run: pnpm --dir extensions/vscode run typecheck

      - name: Test extension
        run: pnpm --dir extensions/vscode test

      - name: Test public Runtime process
        env:
          ONEAGENT_MCP_BIN: ${{ format('{0}/target/debug/oneagent-mcp{1}', github.workspace, runner.os == 'Windows' && '.exe' || '') }}
        run: pnpm --dir extensions/vscode run test:process

      - name: Audit package inventory
        run: pnpm --dir extensions/vscode run package:check

      - name: Verify clean VSIX builds
        run: pnpm --dir extensions/vscode run package:verify

      - name: Audit extension scope and dependencies
        run: pnpm --dir extensions/vscode run audit

  edt:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: extensions/edt/pom.xml

      - name: Verify EDT host runtime boundary
        shell: bash
        working-directory: extensions/edt
        run: java scripts/VerifyHostBoundary.java

      - name: Build public Runtime
        run: cargo build -p oneagent-runtime --bin oneagent-mcp

      - name: Verify EDT extension and real Runtime process
        shell: bash
        working-directory: extensions/edt
        env:
          ONEAGENT_MCP_EXECUTABLE: ${{ format('{0}/target/debug/oneagent-mcp{1}', github.workspace, runner.os == 'Windows' && '.exe' || '') }}
          ONEAGENT_MCP_FIXTURE: ${{ format('{0}/apps/runtime/tests/fixtures/workspace_service/edt', github.workspace) }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Audit EDT p2 package
        shell: bash
        working-directory: extensions/edt
        run: java scripts/VerifyPackage.java repositories/com.oneagent.edt.repository/target/repository
