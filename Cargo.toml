[workspace]
resolver = "2"
members = [
    "apps/runtime",
    "apps/cli",
    "crates/common",
    "crates/workspace",
    "crates/metadata",
    "crates/protocol",
    "crates/graph",
    "crates/bsl",
    "adapters/filesystem",
    "adapters/edt",
    "adapters/designer-xml",
    "adapters/lm-studio",
    "adapters/ollama",
    "adapters/openai-compatible",
    "crates/analysis",
    "crates/llm",
    "crates/tool-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["OneAgent Contributors"]
repository = "https://github.com/oneagent-dev/oneagent"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
