[package]
name = "oneagent-runtime"
version.workspace = true
edition.workspace = true

license.workspace = true

[dependencies]
axum = "0.8.9"
oneagent-analysis = { path = "../../crates/analysis" }
oneagent-common = { path = "../../crates/common" }
oneagent-designer-xml = { path = "../../adapters/designer-xml" }
oneagent-edt = { path = "../../adapters/edt" }
oneagent-graph = { path = "../../crates/graph" }
oneagent-metadata = { path = "../../crates/metadata" }
oneagent-protocol = { path = "../../crates/protocol" }
oneagent-tool-policy = { path = "../../crates/tool-policy" }
oneagent-workspace = { path = "../../crates/workspace" }
oneagent-workspace-fs = { path = "../../adapters/filesystem" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
